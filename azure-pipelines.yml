trigger:
  - main

schedules:
  - cron: "0 * * * *"
    displayName: "Run Every Hour"
    branches:
      include:
        - main
    always: true


pool:
  name: 'Default'
  demands:
    - Agent.Name -equals AgentNikhil
    - Agent.OS -equals Windows_NT

steps:
  - script: node --version
    displayName: 'Check Node.js'

  - script: npm --version
    displayName: 'Check npm'

  - script: npm ci
    displayName: 'Install dependencies'

  - script: npx playwright install --list
            if errorlevel 1 (
                 npx playwright install chromium firefox webkit
            ) else (
               echo Playwright browser check completed.
               npx playwright install chromium firefox webkit
            )
    displayName: 'Install Playwright Browsers'

  - script: npx playwright test --grep "@TC0011"
    displayName: 'npx playwright test --grep "@TC0011"'
