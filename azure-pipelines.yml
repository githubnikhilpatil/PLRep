trigger:
  - main

parameters:
  - name: environment
    displayName: 'Select Environment'
    type: string
    default: 'QA'
    values:
      - QA
      - UAT

  - name: browsers
    displayName: 'Select Browser'
    type: string
    default: 'chromium'
    values:
      - chromium
      - firefox
      - webkit
      - edge

  - name: ExecutionType
    displayName: Execution Type
    type: string
    default: Sanity
    values:
      - Sanity
      - Regression

  - name: Module
    displayName: Regression Module
    type: string
    default: Customers
    values:
      - Customers
      - Deals
      - Orders

schedules:
  - cron: "0 * * * *"
    displayName: "Run Every Hour"
    branches:
      include:
        - main
    always: true


pool:
  name: 'Default'
  demands:
    - Agent.Name -equals AgentNikhil
    - Agent.OS -equals Windows_NT

steps:
  - script: node --version
    displayName: 'Check Node.js'

  - script: npm --version
    displayName: 'Check npm'

  - script: npm ci
    displayName: 'Install dependencies'

  - script: npx playwright install chromium firefox webkit
    displayName: 'Install Playwright Browsers'

  - script: npx playwright test
    env:
      ENV: ${{parameters.environment }}
      BROWSER: ${{ parameters.browsers }}
    displayName: 'npx playwright test'


  - task: PowerShell@2
    displayName: 'Zip Allure Report'
    condition: always()
    inputs:
      targetType: inline
      script: |
        $reportFolder = 'C:\PLDemo\AllureReports'
        $zipPath = "$(Build.ArtifactStagingDirectory)\AllureReport.zip"

        Compress-Archive -Path "$reportFolder\*" -DestinationPath $zipPath -Force

  - task: PublishPipelineArtifact@1
    displayName: 'Publish Zipped Allure Report'
    condition: always()
    inputs:
      targetPath: '$(Build.ArtifactStagingDirectory)\AllureReport.zip'
      artifact: 'AllureReport'
      publishLocation: pipeline


