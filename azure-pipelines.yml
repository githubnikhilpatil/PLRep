trigger:
  - main

parameters:
  - name: environment
    displayName: 'Select Environment'
    type: string
    default: 'QA'
    values:
      - QA
      - UAT

  - name: browsers
    displayName: 'Select Browser'
    type: string
    default: 'chromium'
    values:
      - chromium
      - firefox
      - webkit
      - edge

  - name: ExecutionType
    displayName: Execution Type
    type: string
    default: Sanity
    values:
      - Sanity
      - Regression

  - name: Module
    displayName: Regression Module
    type: string
    default: Customers
    values:
      - Customers
      - Deals
      - Orders

schedules:
  - cron: "0 * * * *"
    displayName: "Run Every Hour"
    branches:
      include:
        - main
    always: true


pool:
  name: 'Default'
  demands:
    - Agent.Name -equals AgentNikhil
    - Agent.OS -equals Windows_NT

steps:
  - script: node --version
    displayName: 'Check Node.js'

  - script: npm --version
    displayName: 'Check npm'

  - script: npm ci
    displayName: 'Install dependencies'

  - script: npx playwright install chromium firefox webkit
    displayName: 'Install Playwright Browsers'

    
  - powershell: |
      $javaHome = "C:\Program Files\Java\jdk1.8.0_202"

      if (!(Test-Path "$javaHome\bin\java.exe")) {
        throw "Java not found at $javaHome. Update the path to your installed JDK."
      }

      Write-Host "##vso[task.setvariable variable=JAVA_HOME]$javaHome"
      Write-Host "##vso[task.prependpath]$javaHome\bin"
      & "$javaHome\bin\java.exe" -version
    displayName: 'Fix JAVA_HOME for Allure'

  - script: npx playwright test
    env:
      ENV: ${{ parameters.environment }}
      BROWSER: ${{ parameters.browsers }}
    displayName: 'npx playwright test'