trigger:
  - main

parameters:
  - name: environment
    displayName: 'Select Environment'
    type: string
    default: 'QA'
    values:
      - QA
      - UAT

  - name: browsers
    displayName: 'Select Browser'
    type: string
    default: 'chromium'
    values:
      - chromium
      - firefox
      - webkit
      - edge

  - name: ExecutionType
    displayName: Execution Type
    type: string
    default: Sanity
    values:
      - Sanity
      - Regression

  - name: Module
    displayName: Regression Module
    type: string
    default: Customers
    values:
      - Customers
      - Deals
      - Orders

schedules:
  - cron: "0 */6 * * *"
    displayName: "Run Every Hour"
    branches:
      include:
        - main
    always: true


pool:
  name: 'Default'
  demands:
    - Agent.Name -equals AgentNikhil
    - Agent.OS -equals Windows_NT

steps:
  - script: node --version
    displayName: 'Check Node.js'

  - script: npm --version
    displayName: 'Check npm'

  - script: npm ci
    displayName: 'Install dependencies'

  - script: npx playwright install chromium firefox webkit
    displayName: 'Install Playwright Browsers'


  - script: npx playwright test
    env:
      ENV: ${{ parameters.environment }}
      BROWSER: ${{ parameters.browsers }}
    displayName: 'npx playwright test'

  # --------------------------------------------------
  # 6. Calculate Allure test summary
  # --------------------------------------------------
  - task: PowerShell@2
    displayName: 'Calculate Allure Test Summary'
    condition: always()
    inputs:
      targetType: inline
      script: |
        $allureRoot = "$(Build.SourcesDirectory)\AllureReports"

        $total = 0
        $passed = 0
        $failed = 0
        $broken = 0
        $skipped = 0
        $unknown = 0

        $summaryDirectory = "$(Build.ArtifactStagingDirectory)"
        New-Item -ItemType Directory -Force -Path $summaryDirectory | Out-Null

        $latestFolder = $null

        if (Test-Path $allureRoot) {
          $latestFolder = Get-ChildItem `
            -Path $allureRoot `
            -Directory `
            -Filter "AllureReport_*" |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
        }

        if ($latestFolder) {
          $resultsFolder = Join-Path $latestFolder.FullName "temp-results"

          if (Test-Path $resultsFolder) {
            $resultFiles = Get-ChildItem `
              -Path $resultsFolder `
              -Filter "*-result.json" `
              -File

            foreach ($file in $resultFiles) {
              try {
                $result = Get-Content $file.FullName -Raw |
                  ConvertFrom-Json

                $total++

                switch ($result.status) {
                  "passed"  { $passed++ }
                  "failed"  { $failed++ }
                  "broken"  { $broken++ }
                  "skipped" { $skipped++ }
                  default   { $unknown++ }
                }
              }
              catch {
                Write-Warning "Could not read result file: $($file.Name)"
              }
            }
          }
        }

        $passRate = if ($total -gt 0) {
          [math]::Round(($passed / $total) * 100, 2)
        } else {
          0
        }

        $summary = @"
        Playwright Automation Test Summary
        ==================================
        Build Number: $(Build.BuildNumber)
        Environment: ${{ parameters.environment }}
        Browser: ${{ parameters.browsers }}
        Execution Type: ${{ parameters.ExecutionType }}
        Module: ${{ parameters.Module }}

        Total Tests: $total
        Passed: $passed
        Failed: $failed
        Broken: $broken
        Skipped: $skipped
        Unknown: $unknown
        Pass Rate: $passRate%
        "@

        Write-Host ""
        Write-Host $summary

        $summaryPath = Join-Path $summaryDirectory "TestSummary.txt"

        Set-Content `
          -Path $summaryPath `
          -Value $summary `
          -Encoding UTF8

        Write-Host "##vso[task.setvariable variable=AllureTotal]$total"
        Write-Host "##vso[task.setvariable variable=AllurePassed]$passed"
        Write-Host "##vso[task.setvariable variable=AllureFailed]$failed"
        Write-Host "##vso[task.setvariable variable=AllureBroken]$broken"
        Write-Host "##vso[task.setvariable variable=AllureSkipped]$skipped"
        Write-Host "##vso[task.setvariable variable=AllureUnknown]$unknown"
        Write-Host "##vso[task.setvariable variable=AllurePassRate]$passRate"


# 7. ZIP only the latest execution's temp-results folder
  - task: PowerShell@2
    displayName: 'Zip Allure temp-results'
    condition: always()
    inputs:
      targetType: inline
      workingDirectory: '$(Build.SourcesDirectory)'
      script: |
        $reportRoot = "$(Build.SourcesDirectory)\AllureReports"
        $stagingFolder = "$(Build.ArtifactStagingDirectory)"
        $zipPath = Join-Path $stagingFolder "Allure-temp-results.zip"

        # Prevent an old ZIP from being published.
        Remove-Item $zipPath -Force -ErrorAction SilentlyContinue

        Write-Host "Searching for Allure results in: $reportRoot"

        if (!(Test-Path $reportRoot)) {
          Write-Host "##vso[task.logissue type=warning]AllureReports folder not found."
          exit 0
        }

        $executionFolder = Get-ChildItem -Path $reportRoot -Directory |
          Where-Object { $_.Name -like "AllureReport_*" } |
          Sort-Object LastWriteTime -Descending |
          Select-Object -First 1

        if (!$executionFolder) {
          Write-Host "##vso[task.logissue type=warning]No Allure execution folder found."
          exit 0
        }

        $resultsFolder = Join-Path $executionFolder.FullName "temp-results"

        Write-Host "Execution folder: $($executionFolder.FullName)"
        Write-Host "Results folder: $resultsFolder"

        if (!(Test-Path $resultsFolder)) {
          Write-Host "##vso[task.logissue type=warning]temp-results folder not found."
          exit 0
        }

        $resultFiles = @(
          Get-ChildItem -Path $resultsFolder -File -Recurse
        )

        if ($resultFiles.Count -eq 0) {
          Write-Host "##vso[task.logissue type=warning]temp-results folder is empty."
          exit 0
        }

        New-Item -ItemType Directory -Path $stagingFolder -Force | Out-Null

        Compress-Archive `
          -Path "$resultsFolder\*" `
          -DestinationPath $zipPath `
          -Force

        if (!(Test-Path $zipPath)) {
          throw "ZIP file was not created: $zipPath"
        }

        Write-Host "ZIP created: $zipPath"
        Write-Host "Files included: $($resultFiles.Count)"

        Write-Host "##vso[task.setvariable variable=AllureZipCreated]true"

  # 8. Publish ZIP as a downloadable Azure Pipeline Artifact
  - task: PublishPipelineArtifact@1
    displayName: 'Publish downloadable Allure results'
    condition: and(always(), eq(variables['AllureZipCreated'], 'true'))
    inputs:
      targetPath: '$(Build.ArtifactStagingDirectory)\Allure-temp-results.zip'
      artifact: 'Allure-temp-results'
      publishLocation: 'pipeline'


  # --------------------------------------------------
  # 9. Publish test summary for download
  # --------------------------------------------------
  - task: PublishPipelineArtifact@1
    displayName: 'Publish Test Summary'
    condition: always()
    inputs:
      targetPath: '$(Build.ArtifactStagingDirectory)\TestSummary.txt'
      artifact: 'Playwright-Test-Summary'
      publishLocation: 'pipeline'


  # 6. Run k6 performance test and generate HTML report
  - task: PowerShell@2
    displayName: 'Run k6 Performance Test'
    inputs:
      targetType: inline
      script: |
        npm run performance

        if ($LASTEXITCODE -ne 0) {
          throw "k6 performance test failed."
        }
      workingDirectory: '$(Build.SourcesDirectory)'
    continueOnError: true



  # 8. Create downloadable ZIP containing the k6 HTML report
  - task: PowerShell@2
    displayName: 'Create k6 HTML Report ZIP'
    condition: always()
    inputs:
      targetType: inline
      script: |
        $reportPath = "$(Build.SourcesDirectory)\performance\dist\performance-report.html"
        $zipPath = "$(Build.ArtifactStagingDirectory)\k6-Performance-HTML-Report.zip"

        if (Test-Path $reportPath) {
          New-Item -ItemType Directory -Force -Path "$(Build.ArtifactStagingDirectory)" | Out-Null

          Compress-Archive -Path $reportPath -DestinationPath $zipPath -Force

          if (Test-Path $zipPath) {
            Write-Host "##vso[task.setvariable variable=K6HtmlZipCreated]true"
            Write-Host "Created downloadable report ZIP: $zipPath"
          }
          else {
            Write-Host "##vso[task.logissue type=warning]k6 report ZIP was not created."
            Write-Host "##vso[task.setvariable variable=K6HtmlZipCreated]false"
          }
        }
        else {
          Write-Host "##vso[task.logissue type=warning]k6 HTML report not found: $reportPath"
          Write-Host "##vso[task.setvariable variable=K6HtmlZipCreated]false"
        }

  # 9. Publish ZIP for download, even if k6 thresholds failed
  - task: PublishPipelineArtifact@1
    displayName: 'Publish k6 Performance Report ZIP'
    condition: and(always(), eq(variables['K6HtmlZipCreated'], 'true'))
    inputs:
      targetPath: '$(Build.ArtifactStagingDirectory)\k6-Performance-HTML-Report.zip'
      artifact: 'k6-Performance-HTML-Report'
      publishLocation: pipeline



  # --------------------------------------------------
  # 9. Send professional HTML email using Gmail
  # --------------------------------------------------
  - task: PowerShell@2
    displayName: 'Email Allure Report and Test Summary'
    condition: and(always(), eq(variables['AllureZipCreated'], 'true'))
    inputs:
      targetType: inline
      script: |
        $zipPath = "$(Build.ArtifactStagingDirectory)\Allure-temp-results.zip"
        $summaryPath = "$(Build.ArtifactStagingDirectory)\TestSummary.txt"
        $k6ZipPath = "$(Build.ArtifactStagingDirectory)\k6-Performance-HTML-Report.zip"

        if (!(Test-Path $zipPath)) {
          throw "Allure ZIP attachment not found: $zipPath"
        }

        if ([string]::IsNullOrWhiteSpace($env:GMAIL_USERNAME) -or
            [string]::IsNullOrWhiteSpace($env:GMAIL_APP_PASSWORD) -or
            [string]::IsNullOrWhiteSpace($env:GMAIL_TO)) {
          throw "Gmail configuration is missing. Check GMAIL_USERNAME, GMAIL_APP_PASSWORD and GMAIL_TO."
        }

        $total = [int]"$(AllureTotal)"
        $passed = [int]"$(AllurePassed)"
        $failed = [int]"$(AllureFailed)"
        $broken = [int]"$(AllureBroken)"
        $skipped = [int]"$(AllureSkipped)"
        $unknown = [int]"$(AllureUnknown)"
        $passRate = [double]"$(AllurePassRate)"

        $passRateWidth = [math]::Max(0, [math]::Min(100, $passRate))

        if ($total -eq 0) {
          $statusText = "NO RESULTS FOUND"
          $statusColor = "#64748b"
          $statusBackground = "#f1f5f9"
        }
        elseif ($failed -gt 0 -or $broken -gt 0 -or $unknown -gt 0) {
          $statusText = "ATTENTION REQUIRED"
          $statusColor = "#dc2626"
          $statusBackground = "#fef2f2"
        }
        else {
          $statusText = "EXECUTION COMPLETED"
          $statusColor = "#15803d"
          $statusBackground = "#f0fdf4"
        }

        $securePassword = ConvertTo-SecureString `
          $env:GMAIL_APP_PASSWORD `
          -AsPlainText `
          -Force

        $credential = New-Object `
          System.Management.Automation.PSCredential(
            $env:GMAIL_USERNAME,
            $securePassword
          )

        $subject = "Playwright Results | Build $(Build.BuildNumber) | $statusText"

        $htmlBody = @"
        <!DOCTYPE html>
        <html>
        <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        </head>
        <body style="margin:0;padding:0;background:#f1f5f9;font-family:Arial,Helvetica,sans-serif;color:#1e293b;">

        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#f1f5f9;">
        <tr><td align="center" style="padding:24px 10px;">

        <table role="presentation" width="640" cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:640px;background:#ffffff;border-radius:12px;overflow:hidden;">

        <tr>
        <td style="background:#172554;padding:28px 30px;color:#ffffff;">
        <div style="font-size:12px;letter-spacing:2px;color:#93c5fd;font-weight:bold;">QUALITY ENGINEERING</div>
        <div style="font-size:25px;font-weight:bold;margin-top:12px;">Playwright Test Report</div>
        <div style="font-size:13px;color:#cbd5e1;margin-top:8px;">Automated test execution summary</div>
        </td>
        </tr>

        <tr>
        <td style="padding:24px 30px 8px;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:$statusBackground;border-radius:8px;">
        <tr><td style="padding:14px 16px;">
        <div style="font-size:11px;color:$statusColor;font-weight:bold;letter-spacing:1px;">EXECUTION STATUS</div>
        <div style="font-size:18px;font-weight:bold;color:$statusColor;margin-top:5px;">$statusText</div>
        </td></tr>
        </table>
        </td>
        </tr>

        <tr>
        <td style="padding:16px 22px 8px;">
        <div style="font-size:18px;font-weight:bold;color:#0f172a;margin:0 8px 14px;">Test Execution Overview</div>

        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
        <tr>
        <td width="50%" style="padding:6px;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;">
        <tr><td style="padding:16px;">
        <div style="font-size:12px;color:#64748b;">Total Tests</div>
        <div style="font-size:30px;font-weight:bold;color:#0f172a;margin-top:6px;">$total</div>
        </td></tr></table>
        </td>
        <td width="50%" style="padding:6px;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#f0fdf4;border:1px solid #bbf7d0;border-radius:8px;">
        <tr><td style="padding:16px;">
        <div style="font-size:12px;color:#166534;">Passed</div>
        <div style="font-size:30px;font-weight:bold;color:#15803d;margin-top:6px;">$passed</div>
        </td></tr></table>
        </td>
        </tr>

        <tr>
        <td width="50%" style="padding:6px;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#fef2f2;border:1px solid #fecaca;border-radius:8px;">
        <tr><td style="padding:16px;">
        <div style="font-size:12px;color:#991b1b;">Failed</div>
        <div style="font-size:30px;font-weight:bold;color:#dc2626;margin-top:6px;">$failed</div>
        </td></tr></table>
        </td>
        <td width="50%" style="padding:6px;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#fff7ed;border:1px solid #fed7aa;border-radius:8px;">
        <tr><td style="padding:16px;">
        <div style="font-size:12px;color:#9a3412;">Broken</div>
        <div style="font-size:30px;font-weight:bold;color:#ea580c;margin-top:6px;">$broken</div>
        </td></tr></table>
        </td>
        </tr>
        </table>

        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin-top:8px;">
        <tr>
        <td style="padding:8px;color:#64748b;font-size:13px;">Skipped: <strong style="color:#334155;">$skipped</strong></td>
        <td style="padding:8px;color:#64748b;font-size:13px;text-align:right;">Unknown: <strong style="color:#334155;">$unknown</strong></td>
        </tr>
        </table>
        </td>
        </tr>

        <tr>
        <td style="padding:18px 30px 24px;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
        <tr>
        <td style="font-size:15px;font-weight:bold;color:#334155;">Overall Pass Rate</td>
        <td align="right" style="font-size:22px;font-weight:bold;color:#15803d;">$passRate%</td>
        </tr>
        <tr><td colspan="2" style="padding-top:12px;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#e2e8f0;border-radius:6px;">
        <tr>
        <td width="$passRateWidth%" height="10" style="height:10px;background:#16a34a;border-radius:6px;font-size:1px;line-height:1px;">&nbsp;</td>
        <td style="font-size:1px;line-height:1px;">&nbsp;</td>
        </tr>
        </table>
        </td></tr>
        </table>
        </td>
        </tr>

        <tr>
        <td style="padding:22px 30px;background:#f8fafc;border-top:1px solid #e2e8f0;">
        <div style="font-size:17px;font-weight:bold;color:#0f172a;margin-bottom:14px;">Execution Details</div>
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="font-size:13px;">
        <tr><td style="padding:8px 0;color:#64748b;">Build Number</td><td align="right" style="padding:8px 0;font-weight:bold;">$(Build.BuildNumber)</td></tr>
        <tr><td style="padding:8px 0;color:#64748b;">Environment</td><td align="right" style="padding:8px 0;font-weight:bold;">${{ parameters.environment }}</td></tr>
        <tr><td style="padding:8px 0;color:#64748b;">Browser</td><td align="right" style="padding:8px 0;font-weight:bold;">${{ parameters.browsers }}</td></tr>
        <tr><td style="padding:8px 0;color:#64748b;">Execution Type</td><td align="right" style="padding:8px 0;font-weight:bold;">${{ parameters.ExecutionType }}</td></tr>
        <tr><td style="padding:8px 0;color:#64748b;">Module</td><td align="right" style="padding:8px 0;font-weight:bold;">${{ parameters.Module }}</td></tr>
        </table>
        </td>
        </tr>

        <tr>
        <td style="padding:24px 30px;">
        <div style="font-size:17px;font-weight:bold;color:#0f172a;margin-bottom:12px;">Report Attachments</div>
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
        <tr><td style="padding:12px;border:1px solid #e2e8f0;border-radius:8px;">
        <div style="font-size:14px;font-weight:bold;color:#1d4ed8;">Allure-temp-results.zip</div>
        <div style="font-size:12px;color:#64748b;margin-top:5px;">Raw Allure test result files</div>
        </td></tr>
        <tr><td height="10" style="height:10px;font-size:1px;">&nbsp;</td></tr>
        <tr><td style="padding:12px;border:1px solid #e2e8f0;border-radius:8px;">
        <div style="font-size:14px;font-weight:bold;color:#334155;">TestSummary.txt</div>
        <div style="font-size:12px;color:#64748b;margin-top:5px;">Text version of the execution summary</div>
        </td></tr>
        <tr>
        <td height="10" style="height:10px;font-size:1px;">&nbsp;</td>
        </tr>
        <tr>
        <td style="padding:12px;border:1px solid #e2e8f0;border-radius:8px;">
        <div style="font-size:14px;font-weight:bold;color:#1d4ed8;">k6-Performance-HTML-Report.zip</div>
        <div style="font-size:12px;color:#64748b;margin-top:5px;">Downloadable HTML performance test report</div>
        </td>
        </tr>
        </table>
        <div style="font-size:12px;color:#64748b;line-height:1.6;margin-top:14px;">The reports are attached to this email. You can also download them from the Artifacts section of the Azure DevOps pipeline run.</div>
        </td>
        </tr>
        <tr>
        <td style="background:#172554;padding:20px 30px;text-align:center;color:#cbd5e1;">
        <div style="font-size:13px;font-weight:bold;color:#ffffff;">Playwright Automation Framework</div>
        <div style="font-size:11px;margin-top:6px;">Automated notification from Azure DevOps</div>
        </td>
        </tr>

        </table>
        </td></tr>
        </table>
        </body>
        </html>
        "@

        $attachments = @($zipPath)

        if (Test-Path $summaryPath) {
          $attachments += $summaryPath
        }
        if (Test-Path $k6ZipPath) {
          $attachments += $k6ZipPath
        }
                
        

        try {
          Send-MailMessage `
            -SmtpServer "smtp.gmail.com" `
            -Port 587 `
            -UseSsl `
            -Credential $credential `
            -From $env:GMAIL_USERNAME `
            -To $env:GMAIL_TO `
            -Subject $subject `
            -Body $htmlBody `
            -BodyAsHtml `
            -Attachments $attachments `
            -ErrorAction Stop

          Write-Host "HTML test report email sent successfully."
        }
        catch {
          Write-Error "Failed to send HTML email: $($_.Exception.Message)"
          throw
        }
    env:
      GMAIL_USERNAME: $(GMAIL_USERNAME)
      GMAIL_APP_PASSWORD: $(GMAIL_APP_PASSWORD)
      GMAIL_TO: $(GMAIL_TO)

