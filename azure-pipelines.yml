trigger:
  - main

parameters:
  - name: environment
    displayName: 'Select Environment'
    type: string
    default: 'QA'
    values:
      - QA
      - UAT

  - name: browsers
    displayName: 'Select Browser'
    type: string
    default: 'chromium'
    values:
      - chromium
      - firefox
      - webkit
      - edge

schedules:
  - cron: "0 * * * *"
    displayName: "Run Every Hour"
    branches:
      include:
        - main
    always: true


pool:
  name: 'Default'
  demands:
    - Agent.Name -equals AgentNikhil
    - Agent.OS -equals Windows_NT

steps:
  - script: node --version
    displayName: 'Check Node.js'

  - script: npm --version
    displayName: 'Check npm'

  - script: npm ci
    displayName: 'Install dependencies'

  - script: npx playwright install chromium firefox webkit
    displayName: 'Install Playwright Browsers'

  - script: npx playwright test --grep "@TC0011"
    env:
      ENV: ${{parameters.environment }}
      BROWSER: ${{ parameters.browsers }}
    displayName: 'npx playwright test --grep "@TC0011"'


