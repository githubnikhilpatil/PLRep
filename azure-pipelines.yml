trigger:
  - main

parameters:
  - name: environment
    displayName: 'Select Environment'
    type: string
    default: 'QA'
    values:
      - QA
      - UAT

  - name: browsers
    displayName: 'Select Browser'
    type: string
    default: 'chromium'
    values:
      - chromium
      - firefox
      - webkit
      - edge

  - name: ExecutionType
    displayName: Execution Type
    type: string
    default: Sanity
    values:
      - Sanity
      - Regression

  - name: Module
    displayName: Regression Module
    type: string
    default: Customers
    values:
      - Customers
      - Deals
      - Orders

schedules:
  - cron: "0 * * * *"
    displayName: "Run Every Hour"
    branches:
      include:
        - main
    always: true


pool:
  name: 'Default'
  demands:
    - Agent.Name -equals AgentNikhil
    - Agent.OS -equals Windows_NT

steps:
  - script: node --version
    displayName: 'Check Node.js'

  - script: npm --version
    displayName: 'Check npm'

  - script: npm ci
    displayName: 'Install dependencies'

  - script: npx playwright install chromium firefox webkit
    displayName: 'Install Playwright Browsers'


        



  - task: PowerShell@2
    displayName: 'Fix Java and Allure PATH'
    inputs:
      targetType: inline
      script: |
        # Correct JAVA_HOME: remove the \bin suffix
        $javaHome = 'C:\Program Files\Java\jdk1.8.0_202'
        $javaExe = Join-Path $javaHome 'bin\java.exe'

        if (!(Test-Path $javaExe)) {
          throw "Java executable not found: $javaExe"
        }

        Write-Host "##vso[task.setvariable variable=JAVA_HOME]$javaHome"
        Write-Host "##vso[task.prependpath]$javaHome\bin"

        # Locate the project's locally installed Allure CLI
        $allureCmd = Join-Path "$(Build.SourcesDirectory)" 'node_modules\.bin\allure.cmd'

        if (!(Test-Path $allureCmd)) {
          throw "Allure CLI not found at $allureCmd. Verify allure-commandline is installed."
        }

        Write-Host "##vso[task.prependpath]$(Build.SourcesDirectory)\node_modules\.bin"

        & $javaExe -version
        if ($LASTEXITCODE -ne 0) {
          throw "Java verification failed."
        }

        & $allureCmd --version
        if ($LASTEXITCODE -ne 0) {
          throw "Allure CLI verification failed."
        }
      workingDirectory: '$(Build.SourcesDirectory)'

  - script: |
      echo JAVA_HOME=%JAVA_HOME%
      java -version
      allure --version
      allure generate --help
    displayName: 'Verify Java and Allure'

  - script: npx playwright test
    env:
      ENV: ${{ parameters.environment }}
      BROWSER: ${{ parameters.browsers }}
    displayName: 'npx playwright test'